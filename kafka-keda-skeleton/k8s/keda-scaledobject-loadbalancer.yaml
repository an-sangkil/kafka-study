# keda-scaledobject.yaml
# ----------------------------------------
# KEDA 가 동작되는 k8s yaml
# .deployment 된 application pod 를 kafka leg 를 감시하고
#  leg 범위가 1000 이상 차날때
#
# ----------------------------------------
# kubectl apply -f ./keda-scaledobject.yaml
# kubectl logs -f -l  app=kafka-keda-skeleton -n order-service
# ----------------------------------------
# LoadBalancer Type으로 L4/L7을 붙여서 사용한다.
# 로컬에서 테스트 하기 위해서는 port-forwarding 한다.
# kubectl port-forward service/kafka-keda-skeleton-service 8080:8080 -n order-service
# ----------------------------------------


apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kafka-consumer-scaler
  namespace: order-service
spec:
  # 스케일링 대상 Deployment
  scaleTargetRef:
    name: kafka-keda-skeleton-deployment
  
  # 스케일링 범위 설정
  minReplicaCount: 1    # 최소 pod 개수
  maxReplicaCount: 10   # 최대 pod 개수
  
  # 스케일링 정책
  pollingInterval: 30   # KEDA가 메트릭을 체크하는 주기 (초)
  cooldownPeriod: 300   # 스케일 다운 대기시간 (초)
  
  # Kafka 컨슈머 lag 기반 트리거
  triggers:
  - type: kafka
    metadata:
      # Kafka 브로커 주소(k8s 내부)
      bootstrapServers: kafka.kafka-nm.svc.cluster.local:9092
      # 모니터링할 컨슈머 그룹
      consumerGroup: order-processing-group
      # 모니터링할 토픽
      topic: order-events
      # 스케일링 임계값 (lag가 이 값 이상이면 스케일 아웃)
      lagThreshold: '1000'
      # 오프셋 리셋 정책
      offsetResetPolicy: earliest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-keda-skeleton-deployment
  namespace: order-service
  labels:
    app: kafka-keda-skeleton
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-keda-skeleton
  template:
    metadata:
      labels:
        app: kafka-keda-skeleton
    spec:
      containers:
      - name: kafka-keda-skeleton
        image: kafka-keda-skeleton:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        # Kafka 브로커 주소 (k8s 내부)
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.kafka-nm.svc.cluster.local:9092"
        # 컨슈머 그룹 설정
        - name: SPRING_KAFKA_CONSUMER_GROUP_ID
          value: "order-processing-group"
        # 애플리케이션 이름
        - name: SPRING_APPLICATION_NAME
          value: "kafka-skeleton"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # 헬스체크 설정
#        livenessProbe:
#          httpGet:
#            path: /actuator/health
#            port: 8080
#          initialDelaySeconds: 60
#          periodSeconds: 30
#        readinessProbe:
#          httpGet:
#            path: /actuator/health
#            port: 8080
#          initialDelaySeconds: 30
#          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-keda-skeleton-service
  namespace: order-service
spec:
  selector:
    app: kafka-keda-skeleton
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: LoadBalancer