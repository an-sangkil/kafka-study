# keda-scaledobject-ingress.yaml
# ----------------------------------------
# Ingress Nginx를 사용하는 KEDA 설정
# L7 로드밸런싱으로 path 기반 라우팅 지원
#
# Prerequisites:
# kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/cloud/deploy.yaml
#
# kubectl apply -f ./keda-scaledobject-ingress.yaml
# kubectl get ingress -n order-service
# kubectl logs -f -l app=kafka-keda-skeleton -n order-service
# ----------------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: order-service
data:
  # 호스트 머신의 Docker Compose Kafka 클러스터
  bootstrap.servers: "host.docker.internal:9092,host.docker.internal:9093,host.docker.internal:9094"
  #bootstrap.servers: "kafka.kafka-nm.svc.cluster.local:9092"    # k8s 내부
  consumer.group.id: "order-processing-group"
  spring.profiles.active: "k8s"
  topic.order-events: "order-events"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kafka-consumer-scaler
  namespace: order-service
spec:
  # 스케일링 대상 Deployment
  scaleTargetRef:
    name: kafka-keda-skeleton-deployment

  # 스케일링 범위 설정
  minReplicaCount: 1    # 최소 pod 개수
  maxReplicaCount: 10   # 최대 pod 개수

  # 스케일링 정책
  pollingInterval: 30   # KEDA가 메트릭을 체크하는 주기 (초)
  cooldownPeriod: 300   # 스케일 다운 대기시간 (초)

  # Kafka 컨슈머 lag 기반 트리거
  triggers:
  - type: kafka
    metadata:
      # Kafka 브로커 주소 (호스트 머신의 Docker Compose 클러스터)
      bootstrapServers: host.docker.internal:9092,host.docker.internal:9093,host.docker.internal:9094
      #bootstrapServers: kafka.kafka-nm.svc.cluster.local:9092
      # 모니터링할 컨슈머 그룹
      consumerGroup: order-processing-group
      # 모니터링할 토픽
      topic: order-events
      # 스케일링 임계값 (lag가 이 값 이상이면 스케일 아웃)
      lagThreshold: '1000'
      # 오프셋 리셋 정책
      offsetResetPolicy: earliest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-keda-skeleton-deployment
  namespace: order-service
  labels:
    app: kafka-keda-skeleton
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-keda-skeleton
  template:
    metadata:
      labels:
        app: kafka-keda-skeleton
    spec:
      containers:
      - name: kafka-keda-skeleton
        image: kafka-keda-skeleton:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        # Kafka 브로커 주소 (ConfigMap에서 가져오기)
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: kafka-config
              key: bootstrap.servers
        # 컨슈머 그룹 설정 (ConfigMap에서 가져오기)
        - name: SPRING_KAFKA_CONSUMER_GROUP_ID
          valueFrom:
            configMapKeyRef:
              name: kafka-config
              key: consumer.group.id
        # Spring 프로필 설정 (ConfigMap에서 가져오기)
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: kafka-config
              key: spring.profiles.active
        # 애플리케이션 이름
        - name: SPRING_APPLICATION_NAME
          value: "kafka-skeleton"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # 헬스체크 설정
#        livenessProbe:
#          httpGet:
#            path: /actuator/health
#            port: 8080
#          initialDelaySeconds: 60
#          periodSeconds: 30
#        readinessProbe:
#          httpGet:
#            path: /actuator/health
#            port: 8080
#          initialDelaySeconds: 30
#          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-keda-skeleton-service
  namespace: order-service
spec:
  selector:
    app: kafka-keda-skeleton
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP  # LoadBalancer에서 ClusterIP로 변경
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-keda-skeleton-ingress
  namespace: order-service
  annotations:
    # SSL 리다이렉트 비활성화 (개발환경)
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # 타임아웃 설정
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx # Nginx Ingress Controller 사용
  rules:
  # 도메인 기반 라우팅 (선택사항)
  # - host: kafka-skeleton.example.com
  - http:
      paths:
      # Path 기반 라우팅
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kafka-keda-skeleton-service
            port:
              number: 8080
  # TLS 설정 (선택사항)
  # tls:
  # - hosts:
  #   - kafka-skeleton.example.com
  #   secretName: kafka-skeleton-tls