#
# kafka-deployment-cluster.yaml
# ---------------------------
# kubectl apply -f {filename} -n {namespace}
# ---------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config-cluster
  namespace: kafka-nm
data:
  # KRaft 모드 설정 (Zookeeper 없이 실행)
  KAFKA_PROCESS_ROLES: "broker,controller"

  # 클러스터 모드: 3개 노드 모두 quorum voters에 포함
  KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka-0.kafka.kafka-nm.svc.cluster.local:9093,1@kafka-1.kafka.kafka-nm.svc.cluster.local:9093,2@kafka-2.kafka.kafka-nm.svc.cluster.local:9093"

  # 리스너 설정
  KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

  # 클러스터 ID (KRaft 필수) - 모든 노드가 동일한 CLUSTER_ID 사용
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  # 로그 디렉토리
  KAFKA_LOG_DIRS: "/var/lib/kafka/data"

  # 클러스터 모드 설정: 복제 계수 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka-nm
  labels:
    app: kafka
spec:
  ports:
  - port: 9092
    name: client
    targetPort: 9092
  - port: 9093
    name: controller
    targetPort: 9093
  selector:
    app: kafka
  clusterIP: None  # Headless service for StatefulSet
  publishNotReadyAddresses: true  # Ready 아닌 Pod도 DNS 등록 (클러스터 형성 필수)
---
# 외부 접근을 위한 NodePort Services (각 broker별로 생성)
apiVersion: v1
kind: Service
metadata:
  name: kafka-0-external
  namespace: kafka-nm
  labels:
    app: kafka
spec:
  type: NodePort
  ports:
  - port: 9094
    targetPort: 9094
    nodePort: 30092
    name: external
  selector:
    app: kafka
    statefulset.kubernetes.io/pod-name: kafka-0
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-1-external
  namespace: kafka-nm
  labels:
    app: kafka
spec:
  type: NodePort
  ports:
  - port: 9094
    targetPort: 9094
    nodePort: 30093
    name: external
  selector:
    app: kafka
    statefulset.kubernetes.io/pod-name: kafka-1
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-2-external
  namespace: kafka-nm
  labels:
    app: kafka
spec:
  type: NodePort
  ports:
  - port: 9094
    targetPort: 9094
    nodePort: 30094
    name: external
  selector:
    app: kafka
    statefulset.kubernetes.io/pod-name: kafka-2
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka-nm
  labels:
    app: kafka
spec:
  serviceName: kafka
  replicas: 3                     # 클러스터 모드: 3개의 Kafka 브로커
  podManagementPolicy: Parallel   # 모든 Pod를 동시에 생성
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.5.0
        # command를 사용해서 HOSTNAME에서 NODE_ID 추출 후 Kafka 시작
        command:
        - bash
        - -c
        - |
          # HOSTNAME은 자동으로 kafka-0, kafka-1, kafka-2가 됨
          export KAFKA_NODE_ID=${HOSTNAME##*-}
          # NodePort 계산 (kafka-0 -> 30092, kafka-1 -> 30093, kafka-2 -> 30094)
          export NODE_PORT=$((30092 + KAFKA_NODE_ID))
          # 내부 통신용(PLAINTEXT)과 외부 접근용(EXTERNAL) 리스너 설정
          export KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://${HOSTNAME}.kafka.kafka-nm.svc.cluster.local:9092,EXTERNAL://${NODE_IP}:${NODE_PORT}
          echo "Starting Kafka with NODE_ID: ${KAFKA_NODE_ID}, NodePort: ${NODE_PORT}"
          # Confluent Docker의 기본 시작 스크립트 실행
          /etc/confluent/docker/run
        ports:
        - containerPort: 9092
          name: client
        - containerPort: 9093
          name: controller
        - containerPort: 9094
          name: external
        env:
        # Kubernetes Node IP를 환경 변수로 주입 (외부 접근용)
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        # ConfigMap에서 모든 환경 변수 로드
        envFrom:
        - configMapRef:
            name: kafka-config-cluster

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data

        # 헬스체크 - Kafka 준비 확인
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 10

  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi  # 클러스터 모드에서는 각 노드마다 1Gi, 총 3Gi 사용